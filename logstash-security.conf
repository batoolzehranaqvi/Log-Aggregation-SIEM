input {
  beats {
    port => 5044
  }
}

filter {
  if [log_type] == "authentication" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{HOSTNAME:host} sshd\[%{POSINT:pid}\]: %{DATA:ssh_event} for %{DATA:user} from %{IP:src_ip} port %{POSINT:port} ssh2" }
      match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{HOSTNAME:host} sshd\[%{POSINT:pid}\]: Invalid user %{DATA:user} from %{IP:src_ip} port %{POSINT:port}" }
    }
    date {
      match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
      target => "@timestamp"
    }
    mutate {
      add_field => { "[event][category]" => "authentication" }
    }
  }

  if [log_type] == "nginx_access" {
    grok {
      match => { "message" => "%{IPORHOST:client_ip} - %{DATA:remote_user} \[%{HTTPDATE:http_time}\] \"%{WORD:http_method} %{URIPATHPARAM:request_url} HTTP/%{NUMBER:http_version}\" %{INT:status_code:int} %{INT:body_bytes_sent:int} \"%{DATA:referrer}\" \"%{DATA:user_agent}\"" }
    }
    date {
      match => [ "http_time", "dd/MMM/yyyy:HH:mm:ss Z" ]
      target => "@timestamp"
    }
    mutate {
      add_field => { "[event][category]" => "web" }
    }
  }

  if [src_ip] {
    geoip {
      source => "src_ip"
      target => "geo"
    }
  } else if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geo"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "security-logs-%{+YYYY.MM.dd}"
  }
}
